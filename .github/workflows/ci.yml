# Package tests on Ubuntu and macOS (HiGHS; the Gurobi tests skip without a license).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[compare]" pytest
      - run: commerge --version && commerge-compare --help > /dev/null && python -c "import small_gicp"
      - if: matrix.python != '3.13'   # kiss-matcher wheels: Python 3.8-3.12
        run: python -c "import kiss_matcher"
      - run: pytest -q tests
