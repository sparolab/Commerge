# Wheels of the C++ bindings (commerge-cpp: selection with HiGHS; no registration, no Gurobi), uploaded to
# PyPI on a published release (trusted publishing, configured once on pypi.org for this workflow).
name: Wheels (C++)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: cpp
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ENVIRONMENT: COMMERGE_WITH_REGISTRATION=OFF COMMERGE_WITH_GUROBI=OFF MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_COMMAND: python -c "import commerge_cpp as c, numpy as np; s = c.select(np.eye(50) + 0.0, np.zeros((50, 3)), np.zeros((50, 3)), 0.5, 1); print(c.__version__, len(s.regions))"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pipx run build --sdist cpp
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: cpp/dist/*.tar.gz

  publish:
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi-cpp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
