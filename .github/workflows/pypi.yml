# Wheel + sdist of the commerge package (pure Python); uploaded to PyPI on a published release
# (trusted publishing, configured once on pypi.org for this workflow).
name: PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pipx run build
      - name: Install the wheel and run the tests
        run: |
          pip install dist/*.whl pytest scikit-learn
          commerge --version
          pytest -q python/tests
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
