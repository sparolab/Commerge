# Docker image on GitHub Container Registry: ghcr.io/sparolab/commerge:latest (plus :<version> on a release).
name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/commerge
          T="$IMG:latest"
          if [ "${{ github.event_name }}" = release ]; then T="$T,$IMG:${GITHUB_REF_NAME#v}"; fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Commerge: communication-efficient multi-robot LiDAR map merging
            org.opencontainers.image.licenses=BSD-3-Clause
          cache-from: type=gha
          cache-to: type=gha,mode=max
